name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java (build on 25; tests on JDK 17, 21, 25 and JUnit Platform 1.10 to 6.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      # Held at v5, the last MIT-licensed line of gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build, static analysis, tests, JUnit and JDK matrices, consumer fixtures
        working-directory: java
        # Tests always execute here: the consumer runs the equivalence job validates are produced by
        # the adapter's tests and are not part of any task output the build cache could restore.
        run: ./gradlew check -PtestJavaVersions=17,21 --no-daemon --no-build-cache
      - name: Java equivalence output
        working-directory: java
        run: ./gradlew :sdk:equivalenceOutput --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-equivalence
          path: java/sdk/build/equivalence
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-runs
          path: java/junit-platform/build/consumer-runs
          retention-days: 1

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Typecheck, lint, format, build, tests
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: PostgreSQL persistence, attachment bytes, retention, and query indexes against a Testcontainers PostgreSQL 16
        if: matrix.node == 22
        working-directory: ts
        run: pnpm test:postgres-integration

  playwright:
    name: Playwright reporter (Node ${{ matrix.node }}, Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            playwright: 1.63.0
          - node: 24
            playwright: 1.63.0
          - node: 22
            playwright: 1.57.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install
        working-directory: ts
        run: pnpm install --frozen-lockfile
      - name: Pin the Playwright line under test in the consumer fixture
        if: matrix.playwright != '1.63.0'
        working-directory: ts
        run: pnpm --filter qe-report-playwright-consumer add --save-dev --save-exact @playwright/test@${{ matrix.playwright }}
      - name: Install Chromium
        working-directory: ts/consumer-fixtures/playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and run the consumer fixture
        working-directory: ts
        run: |
          pnpm build
          pnpm test:playwright-consumer
      - name: Project real Playwright runs into the read model
        working-directory: ts
        run: pnpm test:read-model-playwright
      - name: Archive real Playwright runs in PostgreSQL and replay them
        if: matrix.node == 22 && matrix.playwright == '1.63.0'
        working-directory: ts
        run: pnpm test:postgres-playwright

  equivalence:
    name: Cross-language equivalence
    needs: [java, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-equivalence
          path: java/sdk/build/equivalence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumer-runs
          path: java/junit-platform/build/consumer-runs
      - name: Compare Java and TypeScript outputs
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:equivalence
      - name: Validate the Gradle and Maven consumer runs
        working-directory: ts
        run: pnpm test:consumer-runs
      - name: Project the Gradle and Maven consumer runs into the read model
        working-directory: ts
        run: pnpm test:read-model-junit
      - name: Archive real JUnit runs in PostgreSQL and replay them
        working-directory: ts
        run: pnpm test:postgres-junit
