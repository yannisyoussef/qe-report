name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java (build on 25; tests on JDK 17, 21, 25 and JUnit Platform 1.10 to 6.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      # Held at v5, the last MIT-licensed line of gradle/actions.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build, static analysis, tests, JUnit and JDK matrices, consumer fixtures
        working-directory: java
        # Tests always execute here: the consumer runs the equivalence job validates are produced by
        # the adapter's tests and are not part of any task output the build cache could restore.
        run: ./gradlew check -PtestJavaVersions=17,21 --no-daemon --no-build-cache
      - name: Java equivalence output
        working-directory: java
        run: ./gradlew :sdk:equivalenceOutput --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-equivalence
          path: java/sdk/build/equivalence
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-runs
          path: java/junit-platform/build/consumer-runs
          retention-days: 1

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      # The release rehearsal stages the Maven artifacts and runs the clean Java consumers on the
      # published bytecode floor, so the Node 22 path needs both JDKs.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.node == 22
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Typecheck, lint, format, build, tests
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: PostgreSQL persistence, attachment bytes, retention, and query indexes against a Testcontainers PostgreSQL 16
        if: matrix.node == 22
        working-directory: ts
        run: pnpm test:postgres-integration
      - name: HTTP API v1 over PostgreSQL 16, the attachment store, and staging, through real requests
        if: matrix.node == 22
        working-directory: ts
        run: pnpm test:http-integration
      - name: Producer uploads against a real service, PostgreSQL 16, and a staging directory
        if: matrix.node == 22
        working-directory: ts
        run: pnpm test:http-client-integration
      - name: The reference deployment, end to end, including a destructive restore
        if: matrix.node == 22
        working-directory: ts
        run: pnpm test:deployment
      # The release gate. Packs, audits and clean-installs the npm tarballs, stages and signs the
      # Central bundle with an ephemeral key, runs the clean Gradle and Maven consumers on Java 17,
      # builds the release image, and generates the manifest, SBOM and checksums. It publishes
      # nothing, needs no credential, and asserts that it cannot publish.
      - name: The release candidate, rehearsed without publishing anything
        if: matrix.node == 22
        working-directory: ts
        run: pnpm release:verify
        env:
          QE_REPORT_JAVA17_HOME: ${{ env.JAVA_HOME_17_X64 }}
      # The branch a real release takes: a supplied, passphrase-protected key. It generates a
      # throwaway one, so no production credential is involved, and it mutates the passphrase away
      # to prove the passthrough is load-bearing. Runs here because this job has GPG and both JDKs.
      - name: The production signing branch, with a throwaway protected key
        if: matrix.node == 22
        run: node release/sign-regression.mjs
        env:
          QE_REPORT_JAVA17_HOME: ${{ env.JAVA_HOME_17_X64 }}
      - name: The public API has not drifted from its recorded baseline
        if: matrix.node == 22
        run: node release/api-baseline.mjs
        env:
          QE_REPORT_JAVA17_HOME: ${{ env.JAVA_HOME_17_X64 }}
      # Node 24 evidence for the published tarballs: the same clean consumer, on the other runtime
      # the packages claim to support.
      - name: A clean install of the release tarballs, on this Node
        if: matrix.node == 24
        working-directory: ts
        run: pnpm release:npm
      # Scoped to what the rehearsal made. `docker system prune` would also reach anything else on
      # the machine, which is harmless on a hosted runner and is not on a self-hosted one. Each
      # stack already removes its own containers and volumes; this is for one that could not.
      - name: Keep no deployment state behind
        if: always() && matrix.node == 22
        run: |
          for project in $(docker compose ls --all --quiet | grep '^qe-ref-' || true); do
            docker compose --project-name "$project" down --volumes --remove-orphans --timeout 30 || true
          done
          docker image rm --force qe-report:test || true

  playwright:
    name: Playwright reporter (Node ${{ matrix.node }}, Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            playwright: 1.63.0
          - node: 24
            playwright: 1.63.0
          - node: 22
            playwright: 1.57.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Install
        working-directory: ts
        run: pnpm install --frozen-lockfile
      - name: Pin the Playwright line under test in the consumer fixture
        if: matrix.playwright != '1.63.0'
        working-directory: ts
        run: pnpm --filter qe-report-playwright-consumer add --save-dev --save-exact @playwright/test@${{ matrix.playwright }}
      - name: Install Chromium
        working-directory: ts/consumer-fixtures/playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and run the consumer fixture
        working-directory: ts
        run: |
          pnpm build
          pnpm test:playwright-consumer
      # The packed reporter, not the workspace one, under this cell's Playwright. It is what backs
      # the published peer range: the artifact a consumer installs, running under the versions the
      # range claims.
      - name: The packed reporter under this Playwright line
        working-directory: ts
        run: |
          pnpm release:licenses
          node ../release/audit-npm.mjs
          node ../release/consume-playwright.mjs ${{ matrix.playwright }}
      - name: Project real Playwright runs into the read model
        working-directory: ts
        run: pnpm test:read-model-playwright
      - name: Archive real Playwright runs in PostgreSQL and replay them
        if: matrix.node == 22 && matrix.playwright == '1.63.0'
        working-directory: ts
        run: pnpm test:postgres-playwright
      - name: Upload real Playwright runs through HTTP and read them back
        if: matrix.node == 22 && matrix.playwright == '1.63.0'
        working-directory: ts
        run: pnpm test:http-playwright
      - name: Upload real Playwright runs from the reporter itself
        if: matrix.node == 22 && matrix.playwright == '1.63.0'
        working-directory: ts
        run: pnpm test:http-client-playwright
      - name: Upload a real Playwright run through the reference deployment
        if: matrix.node == 22 && matrix.playwright == '1.63.0'
        working-directory: ts
        run: pnpm test:deployment-playwright
      - name: Keep no deployment state behind
        if: always() && matrix.node == 22 && matrix.playwright == '1.63.0'
        run: |
          for project in $(docker compose ls --all --quiet | grep '^qe-ref-' || true); do
            docker compose --project-name "$project" down --volumes --remove-orphans --timeout 30 || true
          done
          docker image rm --force qe-report:test || true

  equivalence:
    name: Cross-language equivalence
    needs: [java, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-equivalence
          path: java/sdk/build/equivalence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumer-runs
          path: java/junit-platform/build/consumer-runs
      - name: Compare Java and TypeScript outputs
        working-directory: ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:equivalence
      - name: Validate the Gradle and Maven consumer runs
        working-directory: ts
        run: pnpm test:consumer-runs
      - name: Project the Gradle and Maven consumer runs into the read model
        working-directory: ts
        run: pnpm test:read-model-junit
      - name: Archive real JUnit runs in PostgreSQL and replay them
        working-directory: ts
        run: pnpm test:postgres-junit
      - name: Upload a real JUnit run through HTTP and read it back
        working-directory: ts
        run: pnpm test:http-junit
      - name: Upload a real JUnit run with the producer command after the build
        working-directory: ts
        run: pnpm test:http-client-junit
      - name: Upload a real JUnit run through the reference deployment
        working-directory: ts
        run: pnpm test:deployment-junit
      - name: Keep no deployment state behind
        if: always()
        run: |
          for project in $(docker compose ls --all --quiet | grep '^qe-ref-' || true); do
            docker compose --project-name "$project" down --volumes --remove-orphans --timeout 30 || true
          done
          docker image rm --force qe-report:test || true
